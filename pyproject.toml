[project]
name = "exedev"
version = "0.3.1"
description = "Official Python SDK for the exe.dev HTTPS API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bold Software, Inc." }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
classifiers = [
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://exe.dev"
Documentation = "https://exe.dev/docs/https-api"
Source = "https://github.com/boldsoftware/exe-sdk-python"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "pyright>=1.1.380", "ruff>=0.5"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pyright]
include = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/exedev", "README.md"]  # generated; aligned comments
